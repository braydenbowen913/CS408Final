name: Rails checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGUSER: nexus
      PGPASSWORD: nexus_test_only
      PGHOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.5.22'
          bundler-cache: true
      - name: Check Bash syntax
        run: |
          for script in start.sh deploy/setup-ec2.sh deploy/deploy.sh; do
            bash -n "$script"
          done
      - run: bundle exec rails db:create db:prepare
        env:
          RAILS_ENV: test
      - run: bundle exec rails test
      - run: bundle exec rails zeitwerk:check
